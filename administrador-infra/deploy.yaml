steps:
  - id: "Inicio"
    name: alpine
    entrypoint: "sh"
    args:
      - "-c"
      - |
        # Autenticarse con GCP
        echo "Iniciado despliegue"
        echo "rama $BRANCH_NAME"
        echo "Repositorio: $REPO_NAME"
        echo "Commit: $COMMIT_SHA"
        CHANGED_FILES=$(git diff --name-only $COMMIT_SHA~1 $COMMIT_SHA)

        echo "Archivos modificados:"
        echo "$CHANGED_FILES"

        # Extraer solo las carpetas raíz modificadas
        CHANGED_DIRS=$(echo "$CHANGED_FILES" | awk -F/ '{print $1}' | sort -u)

        echo "Carpetas modificadas:"
        echo "$CHANGED_DIRS"


  - id: "Desplegar Infraestructura"
    name: hashicorp/terraform:1.7.0
    entrypoint: sh
    args:
        - -c
        - |
          cd administrador-infra/terraform
          echo "====Ejecutando terraform===="
          terraform init -input=false

          echo "====Ejecutando plan===="
          terraform plan -out=tfplan

          echo "====Ejecutando apply===="
          terraform apply -auto-approve -state=tfplan
          echo "termino despliegue..."

options:
  logging: CLOUD_LOGGING_ONLY