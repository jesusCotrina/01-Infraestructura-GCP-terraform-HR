steps:
  - id: "Inicio"
    name: gcr.io/cloud-builders/git
    entrypoint: "sh"
    args:
      - "-c"
      - |
        # Autenticarse con GCP
        echo "Iniciado despliegue"
        echo "rama $BRANCH_NAME"
        echo "Repositorio: $REPO_NAME"
        echo "Commit: $COMMIT_SHA"

  - id: "Detectar carpeta modificada"
    name: alpine/git
    entrypoint: sh
    args:
      - -c
      - |
        echo "== Clonando repo con historial =="
        git clone https://source.developers.google.com/p/$PROJECT_ID/r/$REPO_NAME repo
        cd repo

        git checkout $COMMIT_SHA

        _PREV_COMMIT=$(git rev-parse "${COMMIT_SHA}~1")

        echo "Commit actual: $COMMIT_SHA"
        echo "Commit previo : $_PREV_COMMIT"

        _CHANGED=$(git diff --name-only $_PREV_COMMIT $COMMIT_SHA | grep "service/" | head -n 1)

        if [ -z "$_CHANGED" ]; then
          echo "No changes found in cloud-run-scraping/"
          echo "MODIFIED_FOLDER=" >> /workspace/env.sh
          exit 0
        fi

        FOLDER=$(echo $_CHANGED | cut -d'/' -f1-3)

        echo "Carpeta modificada: $FOLDER"
        echo "MODIFIED_FOLDER=$FOLDER" >> /workspace/env.sh


  - id: "Desplegar Infraestructura"
    name: hashicorp/terraform:1.7.0
    entrypoint: sh
    args:
        - -c
        - |
          cd administrador-infra/terraform
          echo "====Ejecutando terraform===="
          terraform init -input=false

          echo "====Ejecutando plan===="
          terraform plan -out=tfplan

          echo "====Ejecutando apply===="
          terraform apply -auto-approve -state=tfplan
          echo "termino despliegue..."

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  PROJECT_ID: "data-engineer-410822"