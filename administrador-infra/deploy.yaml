steps:
  - id: "Inicio"
    name: gcr.io/cloud-builders/git
    entrypoint: "sh"
    args:
      - "-c"
      - |
        # Autenticarse con GCP
        echo "Iniciado despliegue"
        echo "rama $BRANCH_NAME"
        echo "Repositorio: $REPO_NAME"
        echo "Commit: $COMMIT_SHA"

  - id: "Detectar carpeta modificada"
    name: gcr.io/cloud-builders/git
    entrypoint: sh
    args:
      - -c
      - |
        echo "Iniciando git clone"
        git clone --depth=1000 https://github.com/jesusCotrina/01-Infraestructura-GCP-terraform-HR.git repo
        cd repo
        echo "Contenido de /workspace/repo:"
        ls -la

        echo "git log"
        git log --oneline -n 10

        git checkout $COMMIT_SHA

        _PREV_COMMIT=$(git rev-parse "$COMMIT_SHA^1")

        echo "Commit actual: $COMMIT_SHA"
        echo "Commit previo : ${_PREV_COMMIT:-"N/A (primer commit/push)"}"
        echo "Git diff"
        git show --name-only --pretty="" $COMMIT_SHA



  - id: "Desplegar Infraestructura"
    name: hashicorp/terraform:1.7.0
    entrypoint: sh
    args:
        - -c
        - |
          cd administrador-infra/terraform
          echo "====Ejecutando terraform===="
          terraform init -input=false

          echo "====Ejecutando plan===="
          terraform plan -out=tfplan

          echo "====Ejecutando apply===="
          terraform apply -auto-approve -state=tfplan
          echo "termino despliegue..."

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _PROJECT_ID: "data-engineer-410822"
  _REPO_OWNER: "jesusCotrina"